<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quét Mã Chống Hàng Giả</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#27ae60">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; }
        .scanner-box { width: 100%; height: 220px; background: #222; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; color: white; }
        input[type="text"] { width: 80%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background-color: #219653; }
        .result { margin-top: 20px; padding: 15px; border-radius: 6px; text-align: left; background: #e8f8f5; border-left: 5px solid #27ae60; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔍 Quét Mã Chống Hàng Giả</h2>
        <p>Nhập mã sản phẩm hoặc quét mã QR để xác thực</p>
        
        <form method="POST">
            <input type="text" name="code" placeholder="Nhập mã (VD: SP001, SP002)..." required>
            <button type="submit">Kiểm tra sản phẩm</button>
        </form>

        {% if result %}
        <div class="result">
            <h3>Kết quả xác thực:</h3>
            <p><strong>Tên sản phẩm:</strong> {{ result.name }}</p>
            <p><strong>Trạng thái:</strong> <span style="color: #27ae60; font-weight: bold;">{{ result.status }}</span></p>
            <p><strong>Nhà sản xuất:</strong> {{ result.maker }}</p>
            <p><strong>Ngày sản xuất:</strong> {{ result.date }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
