<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cổng Mua Tem & Cấp Phát Mã QR - Giải Pháp Cuộc Sống</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8fafc; color: #1e293b; line-height: 1.6; padding: 20px; }
        
        .navbar { background: #0f172a; color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-radius: 12px; margin-bottom: 30px; }
        .navbar a { color: #38bdf8; text-decoration: none; font-weight: bold; font-size: 14px; }
        .navbar .brand { font-size: 18px; color: white; }

        .container { max-width: 900px; margin: 0 auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 6px solid #22c55e; }
        h2 { font-size: 24px; color: #0f172a; margin-bottom: 20px; text-align: center; font-weight: 700; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 14px; color: #334155; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group select { padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: #38bdf8; }

        .legal-declaration-box { background: #f8fafc; border: 2px dashed #cbd5e1; padding: 25px; border-radius: 12px; margin: 30px 0; }
        .legal-declaration-box h3 { font-size: 16px; color: #0f172a; margin-bottom: 15px; font-weight: 700; }
        
        .declaration-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .declaration-item { display: flex; flex-direction: column; }
        .declaration-item label { font-size: 13px; color: #64748b; margin-bottom: 5px; font-weight: 500; }
        .declaration-item input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }

        .checkbox-group { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .checkbox-label { display: flex; align-items: flex-start; gap: 12px; font-size: 14px; color: #334155; cursor: pointer; line-height: 1.5; font-weight: 500; }
        .checkbox-label input[type="checkbox"] { width: 20px; height: 20px; accent-color: #22c55e; margin-top: 2px; cursor: pointer; }

        .btn-submit { background: #22c55e; color: white; border: none; padding: 16px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 15px rgba(34,197,94,0.3); transition: 0.2s; text-align: center; }
        .btn-submit:hover { background: #16a34a; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand">🛡️ CỔNG MUA TEM & CẤP PHÁT MÃ QR</div>
        <div>
            <a href="/">&larr; Quay lại Trang Chủ</a> &nbsp;&nbsp;|&nbsp;&nbsp;
            <a href="/news">📖 Xem Cẩm Nang Pháp Lý</a>
        </div>
    </div>

    <div class="container">
        <h2>Biểu Mẫu Đăng Ký Cấp Phát Tem Chuyên Dụng</h2>
        <p style="text-align: center; color: #64748b; margin-bottom: 30px; font-size: 14px;">Hệ thống cung cấp tem vỡ bảo hành linh kiện điện tử và tem niêm phong nắp chai chống bóc mở.</p>

        <form action="/buy" method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label>Tên Sản Phẩm / Linh Kiện:</label>
                    <input type="text" name="prod_name" placeholder="Ví dụ: Bo mạch điện tử IC / Rượu sâm đóng chai" required>
                </div>
                <div class="form-group">
                    <label>Tên Doanh Nghiệp / Nhà Sản Xuất:</label>
                    <input type="text" name="manufacturer" placeholder="Ví dụ: Công ty Điện Tử & Dược Phẩm VN" required>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Mã Số Thuế Doanh Nghiệp:</label>
                    <input type="text" name="tax_code" placeholder="Ví dụ: 0101234567" required>
                </div>
                <div class="form-group">
                    <label>Chọn Số Lượng Tem Cần Đặt:</label>
                    <select name="quantity">
                        <option value="1000">1,000 Tem</option>
                        <option value="5000">5,000 Tem</option>
                        <option value="10000">10,000 Tem</option>
                        <option value="30000" selected>30,000 Tem</option>
                        <option value="50000">50,000 Tem</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Lựa Chọn Loại Tem & Công Nghệ Chuyên Dụng:</label>
                    <select name="print_type">
                        <option value="black_white">Tem QR Tiêu Chuẩn (Decal thường)</option>
                        <option value="hologram_7color">Tem QR 7 Màu / Hologram Cao Cấp (+150đ/tem)</option>
                        <option value="destructible_seal">Tem Vỡ Bảo Hành Linh Kiện Điện Tử (+200đ/tem)</option>
                        <option value="void_bottle">Tem Niêm Phong Nắp Chai / Chống Bóc Void (+250đ/tem)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Kích Thước Tem Phù Hợp:</label>
                    <select name="qr_size">
                        <option value="10">Khổ Siêu Nhỏ: 1.0 x 1.0 cm (Linh kiện điện tử)</option>
                        <option value="15">Khổ Nhỏ: 1.5 x 1.5 cm (Nắp chai / Mạch)</option>
                        <option value="20" selected>Khổ Tiêu Chuẩn: 2.0 x 2.0 cm</option>
                        <option value="25">Khổ Lớn: 2.5 x 2.5 cm</option>
                        <option value="35">Khổ Đóng Thùng: 3.5 x 3.5 cm</option>
                    </select>
                </div>
            </div>

            <div class="legal-declaration-box">
                <h3>📋 Bản Kê Khai Pháp Lý & Cam Kết Chủ Thể</h3>
                <div class="declaration-grid">
                    <div class="declaration-item">
                        <label>Địa Chỉ Xưởng / Nhà Máy Sản Xuất:</label>
                        <input type="text" name="legal_address" placeholder="Ví dụ: KCN Bắc Thăng Long, Hà Nội" required>
                    </div>
                    <div class="declaration-item">
                        <label>Số Điện Thoại Kỹ Thuật / Pháp Lý:</label>
                        <input type="text" name="legal_phone" placeholder="Ví dụ: 0868405499" required>
                    </div>
                </div>

                <div class="declaration-grid">
                    <div class="declaration-item">
                        <label>Số Giấy Chứng Nhận ĐKKD:</label>
                        <input type="text" name="legal_license" placeholder="Ví dụ: GPKD số 0102030405" required>
                    </div>
                    <div class="declaration-item">
                        <label>Dòng Sản Phẩm / Model Thiết Bị:</label>
                        <input type="text" name="legal_brand" placeholder="Ví dụ: Linh kiện bo mạch / Chai lọ cao cấp" required>
                    </div>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="confirm_truth" required>
                        <span>Tôi cam kết thông tin kê khai trên là hoàn toàn chính xác và chịu trách nhiệm pháp lý theo quy định về chất lượng linh kiện điện tử và hàng hóa đóng chai.</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="confirm_ip" required>
                        <span>Tôi cam kết tem vỡ và tem niêm phong được sử dụng đúng mục đích bảo hành thiết bị, chống bóc mở trái phép.</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-submit">🚀 Xác Nhận Đặt Mua & Nhận Mã VietQR Thanh Toán</button>
        </form>
    </div>

</body>
</html>
